services:

  postgres:
    image: postgres:17
    container_name: deutschmate-postgres

    environment:
      POSTGRES_DB: deutschmate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: deutschmate-redis

    ports:
      - "6379:6379"

volumes:
  postgres_data: